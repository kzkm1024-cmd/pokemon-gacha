<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ランダムポケモン</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #e0f0ff 0%, #d0e8ff 40%, #c8d8f8 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #1a2a4a;
    }

    h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
      text-shadow: 0 2px 12px rgba(100,150,220,0.3);
    }

    h1 span { color: #3a6fd8; }

    .subtitle {
      color: #5a7aa0;
      font-size: 0.9rem;
      margin-bottom: 32px;
    }

    #btn {
      background: #f7d900;
      color: #1a1a2e;
      border: none;
      border-radius: 50px;
      padding: 16px 40px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
      box-shadow: 0 4px 20px rgba(247,217,0,0.4);
      user-select: none;
    }

    #btn:hover { background: #ffe438; transform: translateY(-2px); box-shadow: 0 8px 28px rgba(247,217,0,0.5); }
    #btn:active { transform: translateY(0); }
    #btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    #card {
      margin-top: 36px;
      background: rgba(255,255,255,0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(160,190,230,0.4);
      border-radius: 24px;
      padding: 32px 36px;
      width: 100%;
      max-width: 420px;
      display: none;
      animation: fadeIn 0.35s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    #card.show { display: block; }

    .pokemon-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
    }

    #sprite {
      width: 100px;
      height: 100px;
      image-rendering: pixelated;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.5));
    }

    .pokemon-info { flex: 1; }

    #pokemon-no {
      font-size: 0.75rem;
      color: #5a7aa0;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    #pokemon-name {
      font-size: 2rem;
      font-weight: 800;
      text-transform: capitalize;
      line-height: 1.1;
      margin: 2px 0 10px;
    }

    .types { display: flex; gap: 6px; flex-wrap: wrap; }

    .type-badge {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .divider {
      height: 1px;
      background: rgba(100,140,200,0.2);
      margin: 20px 0;
    }

    .meta {
      display: flex;
      gap: 16px;
      margin-bottom: 20px;
    }

    .meta-item {
      flex: 1;
      background: rgba(180,210,255,0.35);
      border-radius: 12px;
      padding: 10px 14px;
      text-align: center;
    }

    .meta-label {
      font-size: 0.68rem;
      color: #5a7aa0;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .meta-value {
      font-size: 1.05rem;
      font-weight: 700;
    }

    .stats-title {
      font-size: 0.75rem;
      color: #5a7aa0;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .stat-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .stat-name {
      font-size: 0.72rem;
      color: #4a6a90;
      font-weight: 600;
      width: 60px;
      flex-shrink: 0;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .stat-val {
      font-size: 0.8rem;
      font-weight: 700;
      width: 30px;
      text-align: right;
      flex-shrink: 0;
    }

    .stat-bar-bg {
      flex: 1;
      background: rgba(100,140,200,0.2);
      border-radius: 99px;
      height: 6px;
      overflow: hidden;
    }

    .stat-bar {
      height: 100%;
      border-radius: 99px;
      transition: width 0.6s cubic-bezier(0.25, 1, 0.5, 1);
    }

    #loader {
      margin-top: 36px;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      color: #5a7aa0;
      font-size: 0.9rem;
    }

    #loader.show { display: flex; }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #f7d900;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Type colors */
    .type-normal    { background: #9fa19f; color: #fff; }
    .type-fire      { background: #e62829; color: #fff; }
    .type-water     { background: #2980ef; color: #fff; }
    .type-electric  { background: #fac000; color: #1a1a2e; }
    .type-grass     { background: #3fa129; color: #fff; }
    .type-ice       { background: #3dcef3; color: #1a1a2e; }
    .type-fighting  { background: #ff8000; color: #fff; }
    .type-poison    { background: #9141cb; color: #fff; }
    .type-ground    { background: #915121; color: #fff; }
    .type-flying    { background: #81b9ef; color: #1a1a2e; }
    .type-psychic   { background: #ef4179; color: #fff; }
    .type-bug       { background: #91a119; color: #fff; }
    .type-rock      { background: #afa981; color: #fff; }
    .type-ghost     { background: #704170; color: #fff; }
    .type-dragon    { background: #5060e1; color: #fff; }
    .type-dark      { background: #50413f; color: #fff; }
    .type-steel     { background: #60a1b8; color: #fff; }
    .type-fairy     { background: #ef70ef; color: #fff; }
  </style>
</head>
<body>

  <h1>⚡ <span>ポケモン</span>ガチャ</h1>
  <p class="subtitle">ボタンを押してランダムなポケモンをゲットしよう！</p>

  <button id="btn" onclick="loadRandom()">🎲 ランダムポケモンを見る！</button>

  <div id="loader">
    <div class="spinner"></div>
    <span>ポケモンを探しています...</span>
  </div>

  <div id="card">
    <div class="pokemon-header">
      <img id="sprite" src="" alt="">
      <div class="pokemon-info">
        <div id="pokemon-no"></div>
        <div id="pokemon-name"></div>
        <div class="types" id="types"></div>
      </div>
    </div>

    <div class="divider"></div>

    <div class="meta">
      <div class="meta-item">
        <div class="meta-label">身長</div>
        <div class="meta-value" id="height"></div>
      </div>
      <div class="meta-item">
        <div class="meta-label">体重</div>
        <div class="meta-value" id="weight"></div>
      </div>
    </div>

    <div class="stats-title">基本ステータス</div>
    <div id="stats"></div>
  </div>

  <script>
    const STAT_LABELS = {
      hp: 'HP', attack: '攻撃', defense: '防御',
      'special-attack': '特攻', 'special-defense': '特防', speed: '素早'
    };

    const STAT_COLORS = {
      hp: '#4fc3f7', attack: '#ef5350', defense: '#66bb6a',
      'special-attack': '#ab47bc', 'special-defense': '#26c6da', speed: '#ffa726'
    };

    async function loadRandom() {
      const btn = document.getElementById('btn');
      const card = document.getElementById('card');
      const loader = document.getElementById('loader');

      btn.disabled = true;
      card.classList.remove('show');
      loader.classList.add('show');

      try {
        const id = Math.floor(Math.random() * 1025) + 1;
        const res = await fetch(`https://pokeapi.co/api/v2/pokemon/${id}`);
        if (!res.ok) throw new Error('fetch failed');
        const data = await res.json();
        render(data);
      } catch (e) {
        alert('ポケモンの取得に失敗したで。もう一回試してな！');
      } finally {
        btn.disabled = false;
        loader.classList.remove('show');
      }
    }

    function render(p) {
      document.getElementById('pokemon-no').textContent = `No.${String(p.id).padStart(4,'0')}`;
      document.getElementById('pokemon-name').textContent = p.name;

      const sprite = document.getElementById('sprite');
      sprite.src = p.sprites.other?.['official-artwork']?.front_default || p.sprites.front_default || '';
      sprite.alt = p.name;

      const typesEl = document.getElementById('types');
      typesEl.innerHTML = p.types.map(t =>
        `<span class="type-badge type-${t.type.name}">${t.type.name}</span>`
      ).join('');

      document.getElementById('height').textContent = `${(p.height / 10).toFixed(1)} m`;
      document.getElementById('weight').textContent = `${(p.weight / 10).toFixed(1)} kg`;

      const statsEl = document.getElementById('stats');
      statsEl.innerHTML = p.stats.map(s => {
        const key = s.stat.name;
        const val = s.base_stat;
        const pct = Math.min(100, (val / 255) * 100).toFixed(1);
        const label = STAT_LABELS[key] || key;
        const color = STAT_COLORS[key] || '#fff';
        return `
          <div class="stat-row">
            <span class="stat-name">${label}</span>
            <span class="stat-val">${val}</span>
            <div class="stat-bar-bg">
              <div class="stat-bar" style="width:${pct}%; background:${color}"></div>
            </div>
          </div>`;
      }).join('');

      document.getElementById('card').classList.add('show');
    }
  </script>
</body>
</html>
